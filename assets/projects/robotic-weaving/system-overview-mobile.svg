<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1544" viewBox="0 0 600 1544" role="img" aria-labelledby="title desc"><title id="title">Robotic weaving workflow</title><desc id="desc">Weaving targets and a kinematic model feed joint-angle calculation. Hardware initialization supports control separately. The computer sends serial commands to the controller, which outputs servo signals.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#56869c"/></marker></defs><rect width="100%" height="100%" fill="white"/><g transform="translate(0 -129)" font-family="Arial, DejaVu Sans, sans-serif"><rect x="18" y="145" width="564" height="432" rx="15" fill="#f3f6f8" stroke="none" stroke-width="1.5"/><text x="38" y="179" fill="#56869c" font-size="16" font-weight="700">01  WEAVING TASK PREPARATION</text><rect x="58" y="203" width="484" height="96" rx="15" fill="white" stroke="#d8e2e9" stroke-width="1.5"/><path d="M60 220 V282" stroke="#56869c" stroke-width="4" stroke-linecap="round"/><text x="78" y="237" fill="#29333f" font-size="20" font-weight="700">Patterns &amp; frames</text><text x="78" y="266" fill="#73808c" font-size="16" font-weight="400">Weaving Pattern I / II / III</text><rect x="58" y="329" width="484" height="96" rx="15" fill="white" stroke="#d8e2e9" stroke-width="1.5"/><path d="M60 346 V408" stroke="#56869c" stroke-width="4" stroke-linecap="round"/><text x="78" y="363" fill="#29333f" font-size="20" font-weight="700">Anchor sequence</text><text x="78" y="392" fill="#73808c" font-size="16" font-weight="400">Coordinates + visit order</text><rect x="58" y="455" width="484" height="96" rx="15" fill="white" stroke="#d8e2e9" stroke-width="1.5"/><path d="M60 472 V534" stroke="#56869c" stroke-width="4" stroke-linecap="round"/><text x="78" y="489" fill="#29333f" font-size="20" font-weight="700">Ordered TCP targets</text><text x="78" y="518" fill="#73808c" font-size="16" font-weight="400">Tool position + orientation</text><path d="M300 299 V327" fill="none" stroke="#56869c" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M300 425 V453" fill="none" stroke="#56869c" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="18" y="603" width="564" height="466" rx="15" fill="#f3f6f8" stroke="none" stroke-width="1.5"/><text x="38" y="637" fill="#56869c" font-size="16" font-weight="700">02  ROBOT PREPARATION</text><rect x="58" y="661" width="484" height="96" rx="15" fill="white" stroke="#d8e2e9" stroke-width="1.5"/><path d="M60 678 V740" stroke="#56869c" stroke-width="4" stroke-linecap="round"/><text x="78" y="695" fill="#29333f" font-size="20" font-weight="700">Hardware components</text><text x="78" y="724" fill="#73808c" font-size="16" font-weight="400">Mechanical parts · servos · control board</text><rect x="58" y="787" width="484" height="96" rx="15" fill="white" stroke="#d8e2e9" stroke-width="1.5"/><path d="M60 804 V866" stroke="#56869c" stroke-width="4" stroke-linecap="round"/><text x="78" y="821" fill="#29333f" font-size="20" font-weight="700">Arm assembly</text><text x="78" y="850" fill="#73808c" font-size="16" font-weight="400">Desktop robotic arm + threading tool</text><path d="M300 757 V785" fill="none" stroke="#56869c" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="38" y="937" width="252" height="104" rx="15" fill="white" stroke="#d8e2e9" stroke-width="1.5"/><path d="M40 954 V1024" stroke="#56869c" stroke-width="4" stroke-linecap="round"/><text x="58" y="971" fill="#29333f" font-size="20" font-weight="700">Kinematic model</text><text x="58" y="1000" fill="#73808c" font-size="16" font-weight="400">Link geometry</text><text x="58" y="1024" fill="#73808c" font-size="16" font-weight="400">+ robot frames</text><rect x="316" y="937" width="244" height="104" rx="15" fill="white" stroke="#d8e2e9" stroke-width="1.5"/><path d="M318 954 V1024" stroke="#56869c" stroke-width="4" stroke-linecap="round"/><text x="336" y="971" fill="#29333f" font-size="20" font-weight="700">Servo initialization</text><text x="336" y="1000" fill="#73808c" font-size="16" font-weight="400">Prepare the</text><text x="336" y="1024" fill="#73808c" font-size="16" font-weight="400">physical arm</text><path d="M300 883 V910 H164 V935" fill="none" stroke="#56869c" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M300 910 H438 V935" fill="none" stroke="#56869c" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="58" y="1153" width="484" height="144" rx="15" fill="white" stroke="#d8e2e9" stroke-width="1.5"/><path d="M60 1170 V1280" stroke="#56869c" stroke-width="4" stroke-linecap="round"/><text x="78" y="1187" fill="#29333f" font-size="20" font-weight="700">Joint-angle calculation</text><text x="78" y="1216" fill="#73808c" font-size="16" font-weight="400">TCP targets + robot model</text><text x="78" y="1240" fill="#73808c" font-size="16" font-weight="400">Inverse kinematics → joint commands</text><path d="M58 503 H8 V1195 H56" fill="none" stroke="#56869c" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M164 1041 V1151" fill="none" stroke="#56869c" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="58" y="1357" width="484" height="144" rx="15" fill="white" stroke="#d8e2e9" stroke-width="1.5"/><path d="M60 1374 V1484" stroke="#56869c" stroke-width="4" stroke-linecap="round"/><text x="78" y="1391" fill="#29333f" font-size="20" font-weight="700">Control &amp; weaving test</text><text x="78" y="1420" fill="#73808c" font-size="16" font-weight="400">Computer → serial commands</text><text x="78" y="1444" fill="#73808c" font-size="16" font-weight="400">Controller → servo signals</text><text x="78" y="1468" fill="#73808c" font-size="16" font-weight="400">Physical robot execution</text><path d="M300 1297 V1355" fill="none" stroke="#56869c" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M560 989 H590 V1410 H544" fill="none" stroke="#56869c" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="58" y="1557" width="484" height="100" rx="15" fill="white" stroke="#d8e2e9" stroke-width="1.5"/><path d="M60 1574 V1640" stroke="#56869c" stroke-width="4" stroke-linecap="round"/><text x="78" y="1591" fill="#29333f" font-size="20" font-weight="700">Execution observations</text><text x="78" y="1620" fill="#73808c" font-size="16" font-weight="400">Tool motion + woven sample</text><path d="M300 1501 V1555" fill="none" stroke="#56869c" stroke-width="2.3" marker-end="url(#arrow)"/></g></svg>