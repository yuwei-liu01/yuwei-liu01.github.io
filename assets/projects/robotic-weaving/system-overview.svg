<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="580" viewBox="0 0 1600 580" role="img" aria-labelledby="title desc"><title id="title">Robotic weaving workflow</title><desc id="desc">Weaving targets and a kinematic model feed joint-angle calculation. Hardware initialization supports control separately. The computer sends serial commands to the controller, which outputs servo signals.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#56869c"/></marker></defs><rect width="100%" height="100%" fill="white"/><g transform="translate(0 -149)" font-family="Arial, DejaVu Sans, sans-serif"><rect x="18" y="165" width="845" height="198" rx="15" fill="#f3f6f8" stroke="none" stroke-width="1.5"/><text x="40" y="195" fill="#56869c" font-size="15" font-weight="700">01  WEAVING TASK PREPARATION</text><rect x="40" y="221" width="240" height="110" rx="15" fill="white" stroke="#d8e2e9" stroke-width="1.5"/><path d="M42 238 V314" stroke="#56869c" stroke-width="4" stroke-linecap="round"/><text x="60" y="255" fill="#29333f" font-size="20" font-weight="700">Patterns &amp; frames</text><text x="60" y="284" fill="#73808c" font-size="16" font-weight="400">Weaving Pattern I / II / III</text><rect x="316" y="221" width="236" height="110" rx="15" fill="white" stroke="#d8e2e9" stroke-width="1.5"/><path d="M318 238 V314" stroke="#56869c" stroke-width="4" stroke-linecap="round"/><text x="336" y="255" fill="#29333f" font-size="20" font-weight="700">Anchor sequence</text><text x="336" y="284" fill="#73808c" font-size="16" font-weight="400">Coordinates + visit order</text><rect x="588" y="221" width="252" height="110" rx="15" fill="white" stroke="#d8e2e9" stroke-width="1.5"/><path d="M590 238 V314" stroke="#56869c" stroke-width="4" stroke-linecap="round"/><text x="608" y="255" fill="#29333f" font-size="20" font-weight="700">Ordered TCP targets</text><text x="608" y="284" fill="#7