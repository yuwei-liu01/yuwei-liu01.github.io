roke-width="2.5" /><path d="M-17 -17V17H18M-10 10Q0 -7 15 -12" fill="none" stroke="#59748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(1521 375)"><circle r="25" fill="#eef4ff" stroke="none" stroke-width="2.5" /><path d="M-15 -17L-3 1L-14 17M15 -17L3 1L14 17" fill="none" stroke="#59748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(1521 545)"><circle r="25" fill="#eef4ff" stroke="none" stroke-width="2.5" /><path d="M0 -13A13 13 0 1 1 -.01 -13M0 -22V-17M0 17V22M-22 0H-17M17 0H22" fill="none" stroke="#7761d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle r="4" fill="#7761d9" /></g><g transform="translate(1521 714)"><circle r="25" fill="#eef4ff" stroke="none" stroke-width="2.5" /><path d="M-18 -16H18L5 0V15L-5 20V0Z" fill="none" stroke="#59748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g></svg>